<body>
<main class="page">
  <header class="header"><h1>工具广场</h1><div class="actions"><span class="demo-badge">公开演示 · 模拟数据</span><button class="upload" id="upload">＋ 上传工具</button></div></header>
  <nav class="views" aria-label="内容排序"><button class="on" data-view="recommended">推荐</button><button data-view="latest">最新</button></nav>
  <section class="filter" aria-label="工具筛选"><div class="categories" id="categories"></div><label class="search"><input id="search" type="search" placeholder="搜索工具、作者或分类…" aria-label="搜索工具"></label></section>
  <section><div class="grid" id="grid"></div><div class="empty" id="empty"><strong>没有找到匹配的工具</strong>换一个关键词或分类试试。</div></section>
</main>
<div class="modal-backdrop" id="upload-dialog" hidden="">
  <section class="skill-dialog" role="dialog" aria-modal="true" aria-labelledby="upload-dialog-title">
    <div class="dialog-heading">
      <div><p class="eyebrow">分享你的发现</p><h2 id="upload-dialog-title">上传工具</h2></div>
      <button class="icon-button" id="close-dialog" type="button" aria-label="关闭">×</button>
    </div>
    <form class="skill-form" id="skill-form" novalidate="">
      <div class="form-fields">
        <label class="form-field"><span>工具名称 <em>*</em><small><b id="name-count">0</b>/40</small></span><input id="skill-name" maxlength="40" autocomplete="off" placeholder="例如：故事板创意专家" aria-describedby="name-error"><span class="field-error" id="name-error" role="alert"></span></label>
        <label class="form-field"><span>工具简介 <em>*</em><small><b id="description-count">0</b>/160</small></span><textarea id="skill-description" maxlength="160" rows="4" placeholder="一句话说明它能帮助设计同学完成什么" aria-describedby="description-error"></textarea><span class="field-error" id="description-error" role="alert"></span></label>
        <label class="form-field"><span>分类 <em>*</em></span><select id="skill-category" aria-describedby="category-error"><option value="">请选择分类</option><option value="expert">专家工具</option><option value="ecommerce">电商</option><option value="marketing">营销</option><option value="brand">品牌</option><option value="social">社媒</option><option value="service">服务设计</option><option value="industrial">工业设计</option><option value="ux">体验设计</option><option value="video">视频影音</option></select><span class="field-error" id="category-error" role="alert"></span></label>
        <label class="form-field"><span>目标地址 <em>*</em></span><input id="skill-url" type="url" inputmode="url" placeholder="https://" aria-describedby="url-error"><span class="field-error" id="url-error" role="alert"></span></label>
      </div>
      <aside class="cover-editor">
        <div class="cover-editor-label"><span>封面</span><small>推荐 16:9</small></div>
        <div class="dialog-cover" id="cover-preview"><div class="preview-copy" id="preview-copy"><span id="preview-category">工具</span><strong id="preview-initials">新工</strong><small id="preview-name">新工具</small></div><img id="cover-image" alt="封面预览" hidden=""></div>
        <input class="sr-only" id="skill-cover" type="file" accept="image/png,image/jpeg,image/webp">
        <div class="cover-actions"><button class="secondary-button" id="choose-cover" type="button">上传封面</button><button class="text-button" id="remove-cover" type="button" hidden="">使用模板</button></div>
        <p class="cover-help">PNG、JPEG 或 WebP，最大 5 MB。未上传时自动生成模板封面。</p><span class="field-error" id="cover-error" role="alert"></span>
      </aside>
      <div class="dialog-footer"><p class="submit-note">公开演示仅保存在当前页面，刷新后自动重置。</p><div class="dialog-actions"><button class="secondary-button" id="cancel-upload" type="button">取消</button><button class="primary-button" type="submit">上传工具</button></div></div>
    </form>
  </section>
</div>
<div class="toast" id="toast">演示版本不提交真实内容</div>
<script>
const cats=[['','全部'],['expert','专家工具'],['ecommerce','电商'],['marketing','营销'],['brand','品牌'],['social','社媒'],['service','服务设计'],['industrial','工业设计'],['ux','体验设计'],['video','视频影音']];
const skills=[
['电商套图设计专家','提供商品图片和基础卖点，快速组织商品分析、视觉主题与成套页面结构。','ecommerce','电商','林予安','10月14日更新',1,100],
['品牌 Logo 设计专家','将专业 Logo 设计流程压缩为一次对话，帮助团队建立更清晰的品牌识别。','brand','品牌','Maya Chen','10月13日更新',1,95],
['电商详情页设计专家','输入商品内容，自动梳理详情页信息结构、卖点顺序和视觉设计建议。','ecommerce','电商','陈屿','10月12日更新',1,90],
['全品类带货视频助手','根据商品图与视频需求，生成分镜规划、静帧画面和商品带货短视频。','video','视频影音','Leo Zhang','10月11日更新',1,85],
['故事板创意专家','拆解简单故事、广告或产品素材，生成专业故事板与视觉规划。','marketing','营销','周以宁','10月10日更新',1,80],
['社媒营销专家','覆盖账号定位、选题策划、笔记文案和封面设计的多维营销能力。','social','社媒','Nina Xu','10月9日更新',1,75],
['海报助手','适合制作活动宣传图、商品推广图、节日海报与社媒营销图。','marketing','营销','沈言','10月8日更新',1,70],
['字体设计专家','为特定主题创作兼具装饰性、艺术感和冲击力的标题字体。','brand','品牌','Alex Wu','9月28日更新',1,65],
['用户访谈追问卡','根据研究目标生成访谈提纲，帮助设计师提出更有效的问题。','ux','体验设计','宋知遥','10月14日更新',0,40],
['服务蓝图整理助手','把访谈和业务材料整理成服务阶段、触点、前台与后台活动。','service','服务设计','Riley Zhao','10月13日更新',0,35]
];
const palettes=[['#ffe7e4','#c8424d','#5a2029'],['#f4eadf','#ff6a3d','#25304c'],['#111a31','#a8ed3d','#f6f8ff'],['#dff1ea','#236c58','#173c32'],['#eee6ff','#6e4bd8','#33245f']];let view='recommended',category='',phrase='';
const $=s=>document.querySelector(s),grid=$('#grid'),empty=$('#empty');let coverPreviewUrl='';
function hash(s){return[...s].reduce((a,c)=>(a*31+c.codePointAt(0))>>>0,0)}
function initials(name){return[...name.replace(/Logo|设计专家|助手|专家|工具/g,'')].slice(0,2).join('')||'工具'}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function renderCats(){ $('#categories').innerHTML=cats.map(([id,name])=>`<button class="${id===category?'on':''}" data-cat="${id}">${name}</button>`).join('') }
function render(){let q=phrase.trim().toLowerCase(),rows=skills.filter(s=>(view==='latest'||s[6])&&(!category||s[2]===category)&&(!q||[s[0],s[1],s[3],s[4]].some(v=>v.toLowerCase().includes(q))));rows.sort((a,b)=>b[7]-a[7]);grid.innerHTML=rows.map(s=>{let p=palettes[hash(s[0]+s[3])%palettes.length],owner=[...s[4]][0],image=s[8]?`<img class="cover-uploaded" src="${escapeHtml(s[8])}" alt="">`:'';return`<article class="card"><div class="cover" style="--bg:${p[0]};--accent:${p[1]};--cover-ink:${p[2]}">${image}<span class="tag">${escapeHtml(s[3])}</span><strong class="initials">${escapeHtml(initials(s[0]))}</strong><span class="cover-name">${escapeHtml(s[0])}</span><span class="orbit"></span></div><div class="copy"><h2>${escapeHtml(s[0])}</h2><p>${escapeHtml(s[1])}</p><footer><span class="owner"><span class="avatar">${escapeHtml(owner)}</span>${escapeHtml(s[4])}</span><time>${escapeHtml(s[5])}</time></footer></div></article>`}).join('');empty.style.display=rows.length?'none':'block';grid.style.display=rows.length?'grid':'none';renderCats()}
function setView(next){view=next;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===next));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#categories').onclick=e=>{let b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}};
let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{phrase=e.target.value;render()},180)};
function showToast(message,success=false){let t=$('#toast');t.textContent=message;t.classList.toggle('success',success);t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
function updateUploadPreview(){let name=$('#skill-name').value.trim()||'新工具',selected=$('#skill-category').selectedOptions[0];$('#preview-name').textContent=name;$('#preview-initials').textContent=initials(name);$('#preview-category').textContent=selected?.value?selected.textContent:'工具'}
function clearUploadErrors(){['name','description','category','url','cover'].forEach(key=>{let field=$(`#skill-${key}`),error=$(`#${key}-error`);if(field)field.removeAttribute('aria-invalid');if(error)error.textContent=''})}
function setUploadError(key,message){let field=$(`#skill-${key}`),error=$(`#${key}-error`);if(field)field.setAttribute('aria-invalid','true');if(error)error.textContent=message}
function validateUploadForm(){clearUploadErrors();let first='',name=$('#skill-name').value.trim(),description=$('#skill-description').value.trim(),categoryId=$('#skill-category').value,targetUrl=$('#skill-url').value.trim();if(!name){setUploadError('name','请填写工具名称');first=first||'#skill-name'}if(!description){setUploadError('description','请填写工具简介');first=first||'#skill-description'}if(!categoryId){setUploadError('category','请选择分类');first=first||'#skill-category'}try{let parsed=new URL(targetUrl);if(!['http:','https:'].includes(parsed.protocol))throw new Error()}catch{setUploadError('url','请输入以 http:// 或 https:// 开头的地址');first=first||'#skill-url'}if(first)$(first).focus();return !first}
function removeCoverPreview(){if(coverPreviewUrl)URL.revokeObjectURL(coverPreviewUrl);coverPreviewUrl='';$('#skill-cover').value='';$('#cover-image').src='';$('#cover-image').hidden=true;$('#preview-copy').hidden=false;$('#remove-cover').hidden=true;$('#choose-cover').textContent='上传封面';$('#cover-error').textContent=''}
function resetUploadForm(){removeCoverPreview();$('#skill-form').reset();clearUploadErrors();$('#name-count').textContent='0';$('#description-count').textContent='0';updateUploadPreview()}
function openUploadDialog(){resetUploadForm();$('#upload-dialog').hidden=false;document.body.classList.add('dialog-open');requestAnimationFrame(()=>$('#skill-name').focus())}
function closeUploadDialog(){if($('#upload-dialog').hidden)return;$('#upload-dialog').hidden=true;document.body.classList.remove('dialog-open');resetUploadForm();$('#upload').focus()}
function handleCoverChange(event){let file=event.target.files?.[0];if(!file)return;$('#cover-error').textContent='';if(!['image/png','image/jpeg','image/webp'].includes(file.type)){setUploadError('cover','请选择 PNG、JPEG 或 WebP 图片');event.target.value='';return}if(file.size>5*1024*1024){setUploadError('cover','封面大小不能超过 5 MB');event.target.value='';return}if(coverPreviewUrl)URL.revokeObjectURL(coverPreviewUrl);coverPreviewUrl=URL.createObjectURL(file);$('#cover-image').src=coverPreviewUrl;$('#cover-image').hidden=false;$('#preview-copy').hidden=true;$('#remove-cover').hidden=false;$('#choose-cover').textContent='替换封面'}
function handleUploadSubmit(event){event.preventDefault();if(!validateUploadForm())return;let categoryId=$('#skill-category').value,categoryName=$('#skill-category').selectedOptions[0].textContent,submittedCover=coverPreviewUrl;skills.unshift([$('#skill-name').value.trim(),$('#skill-description').value.trim(),categoryId,categoryName,'演示用户','刚刚上传',0,Date.now(),submittedCover]);coverPreviewUrl='';category='';phrase='';$('#search').value='';setView('latest');closeUploadDialog();showToast('演示上传成功，刷新页面后重置',true)}
cats.slice(1).forEach(([id,name])=>$('#skill-category').insertAdjacentHTML('beforeend',`<option value="${id}">${name}</option>`));
$('#upload').onclick=openUploadDialog;$('#close-dialog').onclick=closeUploadDialog;$('#cancel-upload').onclick=closeUploadDialog;$('#skill-form').onsubmit=handleUploadSubmit;$('#choose-cover').onclick=()=>$('#skill-cover').click();$('#remove-cover').onclick=removeCoverPreview;$('#skill-cover').onchange=handleCoverChange;$('#skill-name').oninput=e=>{$('#name-count').textContent=[...e.target.value].length;updateUploadPreview()};$('#skill-description').oninput=e=>$('#description-count').textContent=[...e.target.value].length;$('#skill-category').onchange=updateUploadPreview;$('#upload-dialog').onmousedown=e=>{if(e.target===$('#upload-dialog'))closeUploadDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#upload-dialog').hidden)closeUploadDialog()});render();
</script>
