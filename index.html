<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f5f7">
<title>神工 · 工具广场</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#18191c;background:#f4f5f7;--ink:#18191c;--muted:#737983;--faint:#9ba1ab;--line:#e1e4e9;--pad:clamp(18px,2.8vw,48px)}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 82% -18%,#fff 0,transparent 38%),#f4f5f7;color:var(--ink);-webkit-font-smoothing:antialiased}button,input{font:inherit}.page{max-width:1920px;margin:auto;padding:0 var(--pad) 64px}.header{height:122px;display:flex;align-items:center;justify-content:space-between;gap:20px}.header h1{margin:0;font-size:clamp(27px,2.1vw,38px);letter-spacing:-.05em}.actions{display:flex;align-items:center;gap:12px}.demo-badge{font-size:12px;color:#68707c;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 10px}.upload{height:46px;border:0;border-radius:12px;padding:0 21px;background:#18191c;color:#fff;font-weight:650;cursor:pointer;transition:.18s}.upload:hover{transform:translateY(-2px);box-shadow:0 10px 24px #1113}.views{display:flex;gap:28px;height:49px;border-bottom:1px solid var(--line)}.views button,.categories button{position:relative;border:0;background:transparent;padding:0;color:var(--faint);cursor:pointer;white-space:nowrap}.views button{height:49px;font-size:18px;font-weight:620}.views button.on{color:var(--ink)}.views button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:4px 4px 0 0;background:#18191c}.filter{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:26px}.categories{display:flex;align-items:center;gap:clamp(17px,2vw,33px);overflow:auto;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.categories button{height:36px;font-size:16px}.categories button.on{color:var(--ink);font-weight:660}.categories button.on:after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;background:#18191c;border-radius:50%;transform:translateX(-50%)}.search{position:relative;flex:0 0 min(290px,28vw)}.search:before{content:"";position:absolute;left:15px;top:13px;width:13px;height:13px;border:1.6px solid #858c96;border-radius:50%}.search:after{content:"";position:absolute;left:27px;top:26px;width:6px;height:1.6px;background:#858c96;transform:rotate(45deg)}.search input{width:100%;height:42px;padding:0 15px 0 41px;border:0;border-radius:11px;outline:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}.search input:focus{box-shadow:inset 0 0 0 1.5px #777e89,0 0 0 3px #2d323a12}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,1.55vw,28px)}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 1px 1px #12151b08;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#cfd3da;box-shadow:0 13px 35px #20242d1a}.cover{position:relative;aspect-ratio:16/9;overflow:hidden;padding:clamp(17px,1.5vw,28px);background:radial-gradient(circle at 78% 24%,var(--accent) 0 10%,transparent 10.7%),linear-gradient(132deg,var(--bg) 0 58%,color-mix(in srgb,var(--bg) 72%,white) 58%);color:var(--cover-ink);isolation:isolate}.cover:before{content:"";position:absolute;right:-9%;bottom:-38%;z-index:-1;width:68%;aspect-ratio:1;border:clamp(23px,4vw,58px) solid var(--accent);border-radius:50%;opacity:.88}.cover:after{content:"";position:absolute;inset:0;z-index:-2;opacity:.1;background-image:linear-gradient(var(--cover-ink) 1px,transparent 1px),linear-gradient(90deg,var(--cover-ink) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(115deg,#000,transparent 68%)}.tag{display:inline-block;padding:5px 9px;border:1px solid color-mix(in srgb,var(--cover-ink) 30%,transparent);border-radius:99px;font-size:11px;font-weight:650}.initials{position:absolute;left:clamp(17px,1.5vw,28px);bottom:clamp(38px,3.1vw,56px);max-width:68%;font-size:clamp(34px,3.4vw,64px);line-height:.9;letter-spacing:-.08em;font-weight:850}.cover-name{position:absolute;left:clamp(17px,1.5vw,28px);bottom:clamp(15px,1.4vw,25px);font-size:12px;font-weight:650}.orbit{position:absolute;right:15%;top:34%;width:42%;aspect-ratio:1;border:1px solid color-mix(in srgb,var(--cover-ink) 55%,transparent);border-radius:50%;transform:rotate(-18deg)}.orbit:after{content:"";position:absolute;left:-4px;top:47%;width:9px;height:9px;border-radius:50%;background:var(--cover-ink)}.copy{min-height:164px;padding:19px 21px 17px;display:flex;flex-direction:column}.copy h2{font-size:19px;line-height:1.25;margin:0 0 11px;letter-spacing:-.02em}.copy p{margin:0;color:#8a9099;font-size:14px;line-height:1.65}.copy footer{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#969ca5;font-size:12px}.owner{display:flex;align-items:center;gap:8px}.avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(145deg,#d65b63,#325d75)}.empty{display:none;text-align:center;padding:90px 20px;color:#777e88}.empty strong{display:block;color:#18191c;font-size:20px;margin-bottom:8px}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;background:#18191c;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:1439px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:1023px){.grid{grid-template-columns:repeat(2,1fr)}.filter{align-items:stretch;flex-direction:column;gap:11px;padding:15px 0 24px}.search{flex:0 0 auto;width:100%}.categories{width:100%}}@media(max-width:639px){.page{padding:0 16px 40px}.header{height:92px}.actions{gap:7px}.demo-badge{display:none}.upload{height:40px;padding:0 15px}.views{height:48px}.filter{padding-top:10px}.grid{grid-template-columns:1fr}.copy{min-height:160px}.cover{padding:18px}.initials{font-size:42px;left:18px;bottom:46px}.cover-name{left:18px;bottom:21px}}
</style>
</head>
<body>
<main class="page">
  <header class="header"><h1>工具广场</h1><div class="actions"><span class="demo-badge">公开演示 · 模拟数据</span><button class="upload" id="upload">＋ 上传工具</button></div></header>
  <nav class="views" aria-label="内容排序"><button class="on" data-view="recommended">推荐</button><button data-view="latest">最新</button></nav>
  <section class="filter" aria-label="工具筛选"><div class="categories" id="categories"></div><label class="search"><input id="search" type="search" placeholder="搜索工具、作者或分类…" aria-label="搜索工具"></label></section>
  <section><div class="grid" id="grid"></div><div class="empty" id="empty"><strong>没有找到匹配的工具</strong>换一个关键词或分类试试。</div></section>
</main>
<div class="toast" id="toast">演示版本不提交真实内容</div>
<script>
const cats=[['','全部'],['expert','专家工具'],['ecommerce','电商'],['marketing','营销'],['brand','品牌'],['social','社媒'],['service','服务设计'],['industrial','工业设计'],['ux','体验设计'],['video','视频影音']];
const skills=[
['电商套图设计专家','提供商品图片和基础卖点，快速组织商品分析、视觉主题与成套页面结构。','ecommerce','电商','林予安','10月14日更新',1,100],
['品牌 Logo 设计专家','将专业 Logo 设计流程压缩为一次对话，帮助团队建立更清晰的品牌识别。','brand','品牌','Maya Chen','10月13日更新',1,95],
['电商详情页设计专家','输入商品内容，自动梳理详情页信息结构、卖点顺序和视觉设计建议。','ecommerce','电商','陈屿','10月12日更新',1,90],
['全品类带货视频助手','根据商品图与视频需求，生成分镜规划、静帧画面和商品带货短视频。','video','视频影音','Leo Zhang','10月11日更新',1,85],
['故事板创意专家','拆解简单故事、广告或产品素材，生成专业故事板与视觉规划。','marketing','营销','周以宁','10月10日更新',1,80],
['社媒营销专家','覆盖账号定位、选题策划、笔记文案和封面设计的多维营销能力。','social','社媒','Nina Xu','10月9日更新',1,75],
['海报助手','适合制作活动宣传图、商品推广图、节日海报与社媒营销图。','marketing','营销','沈言','10月8日更新',1,70],
['字体设计专家','为特定主题创作兼具装饰性、艺术感和冲击力的标题字体。','brand','品牌','Alex Wu','9月28日更新',1,65],
['用户访谈追问卡','根据研究目标生成访谈提纲，帮助设计师提出更有效的问题。','ux','体验设计','宋知遥','10月14日更新',0,40],
['服务蓝图整理助手','把访谈和业务材料整理成服务阶段、触点、前台与后台活动。','service','服务设计','Riley Zhao','10月13日更新',0,35]
];
const palettes=[['#ffe7e4','#c8424d','#5a2029'],['#f4eadf','#ff6a3d','#25304c'],['#111a31','#a8ed3d','#f6f8ff'],['#dff1ea','#236c58','#173c32'],['#eee6ff','#6e4bd8','#33245f']];let view='recommended',category='',phrase='';
const $=s=>document.querySelector(s),grid=$('#grid'),empty=$('#empty');
function hash(s){return[...s].reduce((a,c)=>(a*31+c.codePointAt(0))>>>0,0)}
function initials(name){return[...name.replace(/Logo|设计专家|助手|专家|工具/g,'')].slice(0,2).join('')||'工具'}
function renderCats(){ $('#categories').innerHTML=cats.map(([id,name])=>`<button class="${id===category?'on':''}" data-cat="${id}">${name}</button>`).join('') }
function render(){let q=phrase.trim().toLowerCase(),rows=skills.filter(s=>(view==='latest'||s[6])&&(!category||s[2]===category)&&(!q||[s[0],s[1],s[3],s[4]].some(v=>v.toLowerCase().includes(q))));rows.sort((a,b)=>view==='latest'?b[5].localeCompare(a[5]):b[7]-a[7]);grid.innerHTML=rows.map(s=>{let p=palettes[hash(s[0]+s[3])%palettes.length],owner=[...s[4]][0];return`<article class="card"><div class="cover" style="--bg:${p[0]};--accent:${p[1]};--cover-ink:${p[2]}"><span class="tag">${s[3]}</span><strong class="initials">${initials(s[0])}</strong><span class="cover-name">${s[0]}</span><span class="orbit"></span></div><div class="copy"><h2>${s[0]}</h2><p>${s[1]}</p><footer><span class="owner"><span class="avatar">${owner}</span>${s[4]}</span><time>${s[5]}</time></footer></div></article>`}).join('');empty.style.display=rows.length?'none':'block';grid.style.display=rows.length?'grid':'none';renderCats()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#categories').onclick=e=>{let b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}};
let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{phrase=e.target.value;render()},180)};
$('#upload').onclick=()=>{let t=$('#toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};render();
</script>


</body></html>
